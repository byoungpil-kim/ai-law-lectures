<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>검토단 소집 · 포트폴리오 검토 예제</title>
<style>
:root{--primary:#1E40AF;--secondary:#3B82F6;--bg:#F8FAFC;--text:#0F172A;--muted:#475569;--border:#E2E8F0;}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Inter","Noto Sans KR",system-ui,sans-serif;font-size:16px;line-height:1.6;word-break:keep-all;}
main{max-width:860px;margin:0 auto;padding:32px 24px;}
h1{font-size:1.5rem;letter-spacing:-.02em;margin:0 0 6px;}
.sub{color:var(--muted);margin:0 0 20px;}
button{font:inherit;font-weight:600;border-radius:10px;border:1px solid var(--primary);background:var(--primary);color:#fff;padding:10px 18px;cursor:pointer;}
button:disabled{opacity:.5;cursor:default;}
.card{background:#fff;border:1px solid var(--border);border-radius:16px;padding:18px 20px;margin-top:16px;}
.card h2{font-size:1.05rem;margin:0 0 10px;color:var(--primary);}
table{border-collapse:collapse;width:100%;font-size:14px;}
th,td{border:1px solid var(--border);padding:6px 10px;text-align:left;vertical-align:top;}
th{background:#EFF4FB;}
.muted{color:var(--muted);font-size:13px;}
pre{white-space:pre-wrap;word-break:break-all;font-size:12.5px;background:#EFF4FB;border-radius:10px;padding:12px;}
</style>
</head>
<body>
<main>
  <h1>검토단 소집</h1>
  <p class="sub">강세론·약세론 역할이 병렬로 의견을 내고, 리스크·검증 역할이 두 의견을 검토한다. 매매 실행은 없다. 결정은 사람이 한다.</p>
  <button id="go">검토단 소집 (샘플 데이터)</button>
  <span id="status" class="muted"></span>
  <div id="out"></div>
</main>
<script>
const $ = (s) => document.querySelector(s);
const esc = (t) => String(t ?? "").replace(/[&<>]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const rows = (arr, cols) => `<table><thead><tr>${cols.map(c=>`<th>${esc(c[1])}</th>`).join("")}</tr></thead><tbody>${(arr||[]).map(r=>`<tr>${cols.map(c=>`<td>${esc(r[c[0]])}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
$("#go").addEventListener("click", async () => {
  $("#go").disabled = true; $("#status").textContent = "호출 중 (의견 A·B 병렬 → 검증)…"; $("#out").innerHTML = "";
  try {
    const r = await fetch("/api/review", { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}" });
    const d = await r.json();
    if (d.error) throw new Error(d.error);
    $("#status").textContent = `완료 · 총 비용 $${(d.totalCostUsd||0).toFixed(4)}`;
    $("#out").innerHTML = `
      <div class="card"><h2>1. 강세론 (${esc(d.models.bull)})</h2>${rows(d.bull.table,[["asset","자산"],["reason","강세 근거"],["attractiveness","매력도"]])}<p><b>제안</b>: ${esc(d.bull.proposal)}</p></div>
      <div class="card"><h2>2. 약세론 (${esc(d.models.bear)})</h2>${rows(d.bear.table,[["asset","자산"],["risk","위험 요인"],["alert","경계"]])}<p><b>제안</b>: ${esc(d.bear.proposal)}</p></div>
      <div class="card"><h2>3. 리스크·검증 (${esc(d.models.risk)})</h2>
        <p><b>반론</b> · 강세: ${esc(d.risk.rebuttals?.bull)}<br/>· 약세: ${esc(d.risk.rebuttals?.bear)}</p>
        <p><b>데이터로 확인되지 않은 주장</b>: ${esc((d.risk.unverifiable_claims||[]).join(" / "))}</p>
        ${rows(d.risk.proposals,[["name","안"],["trades","매매"],["within_band","밴드 내"],["cost_note","비용"]])}</div>
      <div class="card"><h2>4. 종합: 의견이 갈린 지점과 남은 질문</h2>
        <ul>${(d.conflicts||[]).map(c=>`<li>${esc(c)}</li>`).join("")}</ul>
        <p><b>사람에게 남기는 질문</b></p><ul>${(d.questions_for_human||[]).map(q=>`<li>${esc(q)}</li>`).join("")}</ul>
        <p class="muted">${esc(d.decision)}</p></div>
      <div class="card"><h2>5. 실행 기록</h2>${rows(d.log,[["role","역할"],["model","모델"],["ms","시간(ms)"],["prompt_tokens","입력 토큰"],["completion_tokens","출력 토큰"],["cost_usd","비용(USD)"]])}</div>`;
  } catch (e) { $("#status").textContent = "실패: " + e.message; }
  finally { $("#go").disabled = false; }
});
</script>
</body>
</html>
