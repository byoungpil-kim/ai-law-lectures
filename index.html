<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AI &amp; Law Lectures — 김병필</title>
<meta name="description" content="김병필 교수의 인공지능과 법 관련 강의 목록" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<meta name="theme-color" content="#1E40AF" />
<style>
  :root{
    --primary:#1E40AF; --secondary:#3B82F6; --accent:#60A5FA;
    --bg:#F8FAFC; --bg-elev:#FFFFFF; --bg-soft:#EFF4FB;
    --text-primary:#0F172A; --text-secondary:#475569; --border:#E2E8F0;
    --shadow-sm:0 1px 2px rgba(15,23,42,.04); --shadow-md:0 4px 12px rgba(15,23,42,.06);
    --radius-lg:16px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;background:var(--bg);color:var(--text-primary);
    font-family:"Inter","Noto Sans KR",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    font-size:16px;line-height:1.6;word-break:keep-all;-webkit-font-smoothing:antialiased;
  }
  a{color:var(--primary);text-decoration:none;}
  a:focus-visible{outline:2px solid var(--secondary);outline-offset:2px;border-radius:6px;}
  main{max-width:720px;margin:0 auto;padding:96px 24px;}
  .section-label{display:inline-block;font-size:.75rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--secondary);margin-bottom:12px;}
  h1{margin:0 0 8px;font-size:clamp(2rem,5vw,2.75rem);line-height:1.2;font-weight:700;letter-spacing:-.02em;}
  p.lead{margin:0 0 40px;color:var(--text-secondary);}
  ul{list-style:none;margin:0;padding:0;}
  li+li{margin-top:10px;}
  .card{
    display:flex;align-items:center;justify-content:space-between;gap:16px;
    padding:18px 22px;border-radius:var(--radius-lg);background:var(--bg-elev);border:1px solid var(--border);box-shadow:var(--shadow-sm);
    transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease;
  }
  .card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);border-color:var(--accent);}
  .card strong{font-size:1.05rem;font-weight:600;color:var(--text-primary);}
  .card span{display:block;font-size:.9rem;color:var(--text-secondary);}
  .card svg{flex:none;width:18px;height:18px;color:var(--primary);}
  footer{margin-top:72px;padding-top:24px;border-top:1px solid var(--border);color:var(--text-secondary);font-size:.85rem;}
</style>
</head>
<body>
<main>
  <span class="section-label">Lectures</span>
  <h1>인공지능과 법 강의</h1>
  <p class="lead">김병필 · KAIST 기술경영전문대학원</p>

  <ul>
    <li>
      <a class="card" href="itm690-2026-fall/">
        <div>
          <strong>[KAIST 강의] 2026년 가을학기</strong>
          <span>ITM.690 인공지능 경영과 법</span>
        </div>
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M6 3l5 5-5 5"/></svg>
      </a>
    </li>
  </ul>

  <footer>© 2026 김병필 · KAIST 기술경영전문대학원</footer>
</main>
</body>
</html>
